apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets-controller   # the name kubeseal expects by default
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
        metrics:
          serviceMonitor:
            enabled: false   # CRD not there yet in this wave; sealed-secrets metrics aren't worth it
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
