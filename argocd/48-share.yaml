apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: share
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JersyJ/lichnovsky.git
    targetRevision: main
    path: apps/share
  destination:
    server: https://kubernetes.default.svc
    namespace: share
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
