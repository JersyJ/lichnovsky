# Discord: Server Settings -> Integrations -> Webhooks -> New Webhook -> Copy URL
#          (a private channel such as #homelab-alerts).
# healthchecks.io: new check, Period 5 min, Grace 10 min. Copy its ping URL, then add the same
#          Discord webhook under Integrations so it can tell you when the pings stop.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-notify
  namespace: monitoring
stringData:
  discord-webhook-url: "__ASK__"
  healthchecks-url: "__ASK__"
