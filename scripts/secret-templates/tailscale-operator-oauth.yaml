# Tailscale admin console -> OAuth client, using the scopes and tag (tag:k8s-operator) listed in
# https://tailscale.com/kb/1236/kubernetes-operator (the scope list changes between releases).
# Also add tagOwners for tag:k8s-operator and tag:k8s to your tailnet policy first.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
stringData:
  client_id: "__ASK__"
  client_secret: "__ASK__"
