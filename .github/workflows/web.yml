# Builds the website image from web/ and deploys it by committing the new tag to apps/web.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

# No rights by default; each job gets only what it needs. The third-party actions run in `build`,
# which can push the image but can't write to the repository. Only `deploy` can push to main, and
# it runs no third-party action.
permissions: {}

concurrency:
  group: web
  cancel-in-progress: false

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 12
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag sha-<commit>, plus OCI labels/annotations (source repo, revision, build time).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jersyj/lichnovsky-web
          tags: type=sha

      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Git stays the source of truth: Argo CD deploys whatever tag is committed here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the new tag
    steps:
      - uses: actions/checkout@v7

      - name: Deploy (commit the new tag)
        if: hashFiles('apps/web/kustomization.yaml') != ''
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # The tag comes from the build job: accept only the form that job makes.
          [[ $TAG =~ ^sha-[0-9a-f]{12}$ ]] || { echo "unexpected tag: '$TAG'"; exit 1; }
          sed -i -E "s|^( *newTag:).*|\1 \"$TAG\"|" apps/web/kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "web: deploy $TAG"
          git pull --rebase
          git push
