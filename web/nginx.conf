# Cache-Control by original URL: hashed assets forever, pages for a minute (Cloudflare honours
# it), health and status data never. Set once at server level: an add_header inside a location
# would drop all server-level headers there.
map $request_uri $cache_control {
    ~^/_astro/          "public, max-age=31536000, immutable";
    ~^/(healthz|status-data/)  "no-store";
    default             "public, max-age=60";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;    # redirects keep the public host, not :8080
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Status widget: Uptime Kuma's already-public status page "home", same origin (no CORS).
    location ~ ^/status-data/(home|heartbeat/home)$ {
        limit_except GET { deny all; }
        rewrite ^/status-data/(.*)$ /api/status-page/$1 break;
        proxy_pass http://uptime-kuma.monitoring.svc.cluster.local;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
