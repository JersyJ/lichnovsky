# Cache-Control by original URL: hashed assets forever, pages for a minute (Cloudflare honours
# it), health and status data never. Set once at server level: an add_header inside a location
# would drop all server-level headers there.
map $request_uri $cache_control {
    ~^/_astro/          "public, max-age=31536000, immutable";
    ~^/(healthz|status-data/)  "no-store";
    default             "public, max-age=60";
}

server {
    listen 8080;
    server_name _;
    root /srv/site;
    absolute_redirect off;    # redirects keep the public host, not :8080
    server_tokens off;        # no nginx version in headers or error pages
    error_page 404 /404.html;

    # Cloudflare compresses for the internet path; this covers home and Tailscale, which reach
    # nginx directly. text/html is always included.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Script and style hashes come from the page's own <meta> policy (astro.config.mjs); these are
    # the parts a <meta> policy can't set.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Resolve the status host per request (cached 30 s) through the cluster DNS (k3s default
    # 10.43.0.10), not once at startup: nginx then starts, and the page serves, even while
    # Uptime Kuma's name doesn't resolve; only the status dots go grey.
    resolver 10.43.0.10 valid=30s ipv6=off;
    resolver_timeout 2s;

    location = /healthz {
        access_log off;       # probes every 10 s from two pods would drown the real requests
        default_type text/plain;
        return 200 "ok\n";
    }

    # Status widget: Uptime Kuma's already-public status page "home", same origin (no CORS).
    location ~ ^/status-data/(home|heartbeat/home)$ {
        limit_except GET { deny all; }
        set $status_upstream uptime-kuma.monitoring.svc.cluster.local;
        rewrite ^/status-data/(.*)$ /api/status-page/$1 break;
        proxy_pass http://$status_upstream;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
