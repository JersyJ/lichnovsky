# Values for the argo-cd Helm chart (argoproj/argo-helm).
# Used twice: once by `helm install` during bootstrap, then by argocd/00-argocd.yaml so
# Argo CD manages itself from Git. Change it here and push; Argo CD upgrades itself.
global:
  domain: argocd.lichnovsky.eu

configs:
  params:
    # TLS ends at Cloudflare (public) or Traefik (LAN), so argocd-server serves plain HTTP.
    server.insecure: true
  cm:
    admin.enabled: true
    exec.enabled: false
    statusbadge.enabled: false
    timeout.reconciliation: 180s
    # Resource types Argo CD doesn't watch or cache. Setting this REPLACES the chart's default list,
    # so the defaults (argo-cd chart 10.9.2) are copied below, with our additions at the end.
    # Re-check the defaults when upgrading the chart major version.
    resource.exclusions: |
      ### Network resources created by the control plane (excluded: fewer watched events, less UI clutter)
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - Endpoints
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
      ### lichnovsky.eu additions: high-churn or tool-internal resources Argo CD never manages here
      - apiGroups:
        - ''
        - events.k8s.io
        kinds:
        - Event
      - apiGroups:
        - acme.cert-manager.io
        kinds:
        - Order
        - Challenge
      - apiGroups:
        - k3s.cattle.io
        kinds:
        - Addon
    # Health check for Application resources. Without it, sync-waves in the app-of-apps don't
    # wait: Argo CD doesn't health-check child Applications by default.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

# Tuned down for a single 8 GB Raspberry Pi.
controller:
  # Go soft memory cap just under the container limit: the GC works harder instead of growing
  # the heap until the kernel OOM-kills the pod.
  env:
    - name: GOMEMLIMIT
      value: "650MiB"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
applicationSet:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
# SSO is handled by Cloudflare Access in front of argocd.lichnovsky.eu, so Dex isn't needed.
dex:
  enabled: false
# Turn this on later if you want Argo CD to post to Discord/Telegram/ntfy.
notifications:
  enabled: false
