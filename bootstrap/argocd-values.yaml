# Used by the bootstrap `helm install`, then by argocd/00-argocd.yaml (Argo CD manages itself).
global:
  domain: argocd.lichnovsky.eu

configs:
  params:
    # TLS ends at Cloudflare (public) or Traefik (LAN), so argocd-server serves plain HTTP.
    server.insecure: true
  cm:
    admin.enabled: true
    exec.enabled: false
    statusbadge.enabled: false
    timeout.reconciliation: 180s
    # This REPLACES the chart's default list, so the defaults (chart 10.9.2) are copied first.
    # Re-check them on a chart major upgrade.
    resource.exclusions: |
      ### Network resources created by the control plane (excluded: fewer watched events, less UI clutter)
      - apiGroups:
        - ''
        - discovery.k8s.io
        kinds:
        - Endpoints
        - EndpointSlice
      ### Internal Kubernetes resources excluded reduce the number of watched events
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      ### Intermediate Certificate Request excluded reduce the number of watched events
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
      ### additions: high-churn resources Argo CD never manages here
      - apiGroups:
        - ''
        - events.k8s.io
        kinds:
        - Event
      - apiGroups:
        - acme.cert-manager.io
        kinds:
        - Order
        - Challenge
      - apiGroups:
        - k3s.cattle.io
        kinds:
        - Addon
    # Without a health check for Applications, sync waves in the app of apps don't wait.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

controller:
  # Soft cap under the limit: the GC works harder instead of the pod being OOM-killed.
  env:
    - name: GOMEMLIMIT
      value: "650MiB"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
applicationSet:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
# Cloudflare Access does the SSO.
dex:
  enabled: false
notifications:
  enabled: true
  argocdUrl: https://argocd.lichnovsky.eu
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  secret:
    create: false   # SealedSecret argocd-notifications-secret in platform/cluster/secrets
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  templates:
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {"embeds": [{
              "title": "❌ {{.app.metadata.name}}: sync failed",
              "url": "{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}",
              "color": 14427686,
              "description": {{ toJson (.app.status.operationState.message | default "" | trunc 1500) }}
            }]}
    template.app-deployed: |
      webhook:
        discord:
          method: POST
          body: |
            {"embeds": [{
              "title": "✅ {{.app.metadata.name}}: deployed",
              "url": "{{.context.argocdUrl}}/applications/argocd/{{.app.metadata.name}}",
              "color": 1483594,
              "description": "
                {{- with .app.status.sync.revision }}{{ trunc 7 . }}
                {{- else }}{{ range .app.status.sync.revisions }}{{ trunc 7 . }} {{ end }}{{ end -}}
              "
            }]}
  triggers:
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [app-sync-failed]
    # Once per finished sync, and only if recent: otherwise enabling this posts every app's last sync.
    trigger.on-deployed: |
      - when: >-
          app.status.operationState != nil and app.status.operationState.phase == 'Succeeded' and
          app.status.health.status == 'Healthy' and
          time.Now().Sub(time.Parse(app.status.operationState.finishedAt)).Minutes() < 30
        oncePer: app.status.operationState.finishedAt
        send: [app-deployed]
  subscriptions:
    - recipients: [discord]
      triggers: [on-sync-failed, on-deployed]
