# lichnovsky.eu website, served from the Pi and published through the Cloudflare Tunnel.
#
# For now: a "coming soon" page served by unprivileged nginx from the ConfigMap below.
# When the real site is ready (built in its own repo), replace the image with yours and delete the
# ConfigMap + its volume. The contract the site's image has to meet is in docs/guide.md §11,
# "Website": linux/arm64, non-root, listens on :8080, serves / and /healthz.
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-placeholder
  namespace: web
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>lichnovsky.eu</title>
      <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               font: 16px/1.5 system-ui, sans-serif; }
        main { text-align: center; padding: 1rem; }
        h1 { font-size: 2rem; margin: 0 0 .25rem; }
        p { margin: 0; opacity: .7; }
      </style>
    </head>
    <body>
      <main>
        <h1>lichnovsky.eu</h1>
        <p>Something is being built here.</p>
      </main>
    </body>
    </html>
  healthz: |
    ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: web
  labels:
    app: website
spec:
  replicas: 2                      # rolling updates without downtime; each pod is ~5 MB
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101             # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: content
          configMap:
            name: website-placeholder
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: website
  namespace: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: website
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: web
spec:
  selector:
    app: website
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: web
spec:
  ingressClassName: traefik
  rules:
    - host: lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
---
# www.lichnovsky.eu -> https://lichnovsky.eu (301). This runs in Traefik, so it works for both
# Cloudflare and LAN visitors.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: web
spec:
  redirectRegex:
    regex: ^https?://www\.lichnovsky\.eu/(.*)
    replacement: https://lichnovsky.eu/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-www
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: web-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
