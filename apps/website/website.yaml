# Placeholder until the real site exists (own repo): unprivileged nginx, :8080, /healthz.
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-nginx
  namespace: web
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Short cache, so edits show up within a minute (Cloudflare honours it).
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "public, max-age=60" always;
        }
        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }

        # Status widget: Uptime Kuma's already-public status page "home", same origin (no CORS).
        location ~ ^/status-data/(home|heartbeat/home)$ {
            limit_except GET { deny all; }
            rewrite ^/status-data/(.*)$ /api/status-page/$1 break;
            proxy_pass http://uptime-kuma.monitoring.svc.cluster.local;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;   # Uptime Kuma sends no-cache; ours below is the one that counts
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store" always;
        }

        location / {
            try_files $uri =404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: website-placeholder
  namespace: web
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>lichnovsky.eu</title>
      <style>
        :root { color-scheme: light dark;
                --ok: #16a34a; --down: #dc2626; --wait: #d97706; --muted: #6b7280; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               font: 16px/1.5 system-ui, sans-serif; }
        main { width: min(34rem, 100% - 2rem); padding: 2rem 0; }
        h1 { font-size: 2rem; margin: 0 0 .25rem; text-align: center; }
        .lead { margin: 0 0 2rem; text-align: center; color: var(--muted); }
        .card { border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
                border-radius: .75rem; padding: 1rem 1.25rem; }
        .summary { display: flex; align-items: center; gap: .5rem; font-weight: 600; margin-bottom: .75rem; }
        ul { list-style: none; margin: 0; padding: 0; }
        li { display: flex; align-items: center; gap: .6rem; padding: .45rem 0;
             border-top: 1px solid color-mix(in srgb, currentColor 8%, transparent); }
        .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); flex: none; }
        .dot.up { background: var(--ok); } .dot.down { background: var(--down); } .dot.wait { background: var(--wait); }
        .name { flex: 1; } .uptime { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
        footer { margin-top: .75rem; font-size: .85rem; color: var(--muted); text-align: center; }
        a { color: inherit; }
      </style>
    </head>
    <body>
      <main>
        <h1>lichnovsky.eu</h1>
        <p class="lead">Something is being built here.</p>
        <section class="card" aria-live="polite">
          <div class="summary"><span class="dot" id="overall"></span><span id="summary">Checking services…</span></div>
          <ul id="services"></ul>
        </section>
        <footer><a href="https://status.lichnovsky.eu/status/home">Full status page</a> · <span id="updated"></span></footer>
      </main>
      <script>
        // Status 1 = up, 0 = down, 2 = pending, 3 = maintenance (Uptime Kuma heartbeat codes).
        const LABEL = { 1: ["up", "Operational"], 0: ["down", "Down"], 2: ["wait", "Pending"], 3: ["wait", "Maintenance"] };
        async function refresh() {
          try {
            const [page, beats] = await Promise.all(
              ["/status-data/home", "/status-data/heartbeat/home"].map(u => fetch(u, { cache: "no-store" }).then(r => {
                if (!r.ok) throw new Error(r.status); return r.json(); })));
            const list = document.getElementById("services"); list.replaceChildren();
            let down = 0, total = 0;
            for (const group of page.publicGroupList) for (const m of group.monitorList) {
              const last = (beats.heartbeatList[m.id] || []).at(-1);
              const [cls, text] = LABEL[last?.status] || ["", "No data"];
              const uptime = beats.uptimeList[m.id + "_24"];
              total++; if (last?.status === 0) down++;
              const li = document.createElement("li");
              li.innerHTML = '<span class="dot"></span><span class="name"></span><span class="uptime"></span>';
              li.children[0].classList.add(cls); li.children[0].title = text;
              li.children[1].textContent = m.name;
              li.children[2].textContent = uptime == null ? text : (uptime * 100).toFixed(2) + " % (24 h)";
              list.append(li);
            }
            const overall = document.getElementById("overall");
            overall.className = "dot " + (down ? "down" : "up");
            document.getElementById("summary").textContent =
              down ? down + " of " + total + " services down" : "All systems operational";
          } catch (e) {
            document.getElementById("overall").className = "dot wait";
            document.getElementById("summary").textContent = "Status currently unavailable";
          }
          document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
        }
        refresh(); setInterval(refresh, 60000);
      </script>
    </body>
    </html>
  healthz: |
    ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: web
  labels:
    app: website
spec:
  replicas: 2                      # rolling updates without downtime
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
      annotations:
        # Bump when website-nginx changes: nginx only reads its config at start.
        website.lichnovsky.eu/nginx-config-rev: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101             # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: content
          configMap:
            name: website-placeholder
        - name: nginx
          configMap:
            name: website-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: website
  namespace: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: website
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: web
spec:
  selector:
    app: website
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: web
spec:
  ingressClassName: traefik
  rules:
    - host: lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
---
# www -> apex (301) in Traefik, so it works on the LAN too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: web
spec:
  redirectRegex:
    regex: ^https?://www\.lichnovsky\.eu/(.*)
    replacement: https://lichnovsky.eu/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-www
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: web-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
