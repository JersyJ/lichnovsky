apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: photos
  # Not backed up yet (too big for the SD card). With a bigger backup disk: k8up.io/backup: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path   # ignores the size; the SSD's free space is the limit
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: photos
  labels:
    app: immich-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-valkey
  template:
    metadata:
      labels:
        app: immich-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0.6-alpine
          # Only job queues live here; they rebuild themselves, so no persistence.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "96mb"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: photos
spec:
  selector:
    app: immich-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: photos
  labels:
    app: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.2.4
          # No machine-learning container (RAM): turn ML off in Administration -> Settings.
          env:
            - { name: TZ, value: "Europe/Prague" }
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: uri
            - { name: DB_VECTOR_EXTENSION, value: "vectorchord" }
            - { name: REDIS_HOSTNAME, value: "immich-valkey" }
            - { name: IMMICH_TELEMETRY_INCLUDE, value: "all" }   # Prometheus metrics on :8081/:8082
          ports:
            - { name: http, containerPort: 2283 }
            - { name: metrics-api, containerPort: 8081 }
            - { name: metrics-ms, containerPort: 8082 }
          volumeMounts:
            - { name: library, mountPath: /data }
          startupProbe:
            httpGet: { path: /api/server/ping, port: http }
            periodSeconds: 10
            failureThreshold: 30       # first boot runs DB migrations; give it up to 5 min
          readinessProbe:
            httpGet: { path: /api/server/ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/server/ping, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: photos
  labels:
    app: immich-server
spec:
  selector:
    app: immich-server
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics-api, port: 8081, targetPort: metrics-api }
    - { name: metrics-ms, port: 8082, targetPort: metrics-ms }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: photos
spec:
  ingressClassName: traefik
  rules:
    - host: photos.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  namespace: photos
spec:
  selector:
    matchLabels:
      app: immich-server
  endpoints:
    - { port: metrics-api, interval: 60s }
    - { port: metrics-ms, interval: 60s }
