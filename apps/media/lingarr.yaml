# Translation for Bazarr: Bazarr sends an English subtitle, Lingarr translates it with DeepL (Free:
# 500,000 characters a month, about 20,000 per episode or movie). Bazarr translates only when you
# select Translate on a subtitle; nothing runs by itself.
# No Ingress and no login: only Bazarr may connect (NetworkPolicy below). After a new config volume,
# run scripts/lingarr-setup.sh one time: it finishes the onboarding and stores the DeepL key from
# the Secret `lingarr` (Lingarr 1.4.1 ignores DEEPL_API_KEY in the env). The other settings are in
# the env, and the script can recreate the key, thus the volume needs no backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lingarr-config
  namespace: tv
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingarr
  namespace: tv
  labels:
    app: lingarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lingarr
  template:
    metadata:
      labels:
        app: lingarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lingarr
          image: ghcr.io/lingarr-translate/lingarr:1.4.1
          env:
            - { name: TZ, value: "Europe/Prague" }
            - { name: ASPNETCORE_URLS, value: "http://+:9876" }
            - { name: DB_CONNECTION, value: sqlite }
            - { name: AUTH_ENABLED, value: "false" }
            - { name: TELEMETRY_ENABLED, value: "false" }
            - { name: SERVICE_TYPE, value: '["deepl"]' }
            - { name: SOURCE_LANGUAGES, value: '[{"name":"English","code":"en"}]' }
            - { name: TARGET_LANGUAGES, value: '[{"name":"Czech","code":"cs"}]' }
          ports:
            - name: http
              containerPort: 9876
          volumeMounts:
            - { name: config, mountPath: /app/config }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lingarr-config
        - name: tmp
          emptyDir: {}
---
# Bazarr's default address for Lingarr is http://lingarr:9876.
apiVersion: v1
kind: Service
metadata:
  name: lingarr
  namespace: tv
spec:
  selector:
    app: lingarr
  ports:
    - name: http
      port: 9876
      targetPort: http
---
# Without a login, any pod could spend the DeepL quota: only Bazarr may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lingarr
  namespace: tv
spec:
  podSelector:
    matchLabels:
      app: lingarr
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bazarr
      ports:
        - port: 9876
