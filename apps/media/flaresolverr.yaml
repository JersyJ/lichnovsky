# Headless Chrome that gets Prowlarr past Cloudflare checks, for indexers tagged "flaresolverr".
# In-cluster only. Chrome is RAM-hungry: if no indexer needs it, delete this file and the proxy
# in configarr.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: tv
  labels:
    app: flaresolverr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - { name: TZ, value: "Europe/Prague" }
          ports:
            - name: http
              containerPort: 8191
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: tv
spec:
  selector:
    app: flaresolverr
  ports:
    - name: http
      port: 8191
      targetPort: http
