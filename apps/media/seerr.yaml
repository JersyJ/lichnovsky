# Requests: browse and request movies and shows (logins are Jellyfin accounts); requests go to
# Radarr/Sonarr. Set up once in its UI (docs/setup.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: tv
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: tv
  labels:
    app: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.0
          env:
            - { name: TZ, value: "Europe/Prague" }
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - { name: config, mountPath: /app/config }
          readinessProbe:
            httpGet: { path: /api/v1/status, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/status, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: tv
spec:
  selector:
    app: seerr
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: tv
spec:
  ingressClassName: traefik
  rules:
    - host: requests.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 80
