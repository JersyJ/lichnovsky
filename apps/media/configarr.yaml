# Configarr (https://configarr.de) applies this config to Sonarr, Radarr and Prowlarr every hour:
# TRaSH-Guides quality profiles and naming, root folders, the qBittorrent connection, and Prowlarr's
# links to Sonarr/Radarr. Settings not listed here stay as set in the apps' UIs.
# Run it now: kubectl -n tv create job --from=cronjob/configarr configarr-now
apiVersion: v1
kind: ConfigMap
metadata:
  name: configarr
  namespace: tv
data:
  config.yml: |
    # "1080p" prefers mid-size x265 (HEVC): about 1-2 Mbit/s, so it plays directly also on a slow
    # line. Order: mid-size x265 (2500), MeGusta/PSA (2000), x265 without group name or large
    # (1900), H.264 (TRaSH tiers, up to about 1850), too large x265 (rejected). The scores are in
    # custom_formats of each app.
    # MeGusta and PSA are in TRaSH's LQ list (-10000): the group format gives the +10000 back and
    # the name format takes 500. The name format also catches titles where the indexer removed the
    # dots and Sonarr/Radarr can't read the group.
    customFormatDefinitions:
      - trash_id: lichnovsky-small-x265-groups
        trash_scores:
          default: 0
        name: Small x265 groups
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: MeGusta or PSA
            implementation: ReleaseGroupSpecification
            negate: false
            required: true
            fields:
              value: "^(MeGusta|PSA)$"
      - trash_id: lichnovsky-small-x265-names
        trash_scores:
          default: 0
        name: Small x265 groups (name)
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: MeGusta or PSA in the name
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '\b(MeGusta|PSA)\b'
      # A title that ends with the codec (optionally a tracker tag) has no group name: often a
      # re-upload with few seeders. Ranks below MeGusta/PSA.
      - trash_id: lichnovsky-x265-no-group
        trash_scores:
          default: 0
        name: x265 without group name
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: Ends with the codec
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '([xh][ ._-]?265|HEVC)(\s*\[[^\]]*\])*(\.mkv)?\s*$'
      # Sonarr only: a large x265 episode is hardly smaller than H.264. 0.8-1.2 GB ranks below the
      # mid-size x265 releases (still above H.264), over 1.2 GB is rejected. Size is of the whole
      # release, thus only for single episodes (not packs).
      - trash_id: lichnovsky-x265-large
        trash_scores:
          default: 0
        name: x265 large
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: x265
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '[xh][ ._-]?265|\bHEVC(\b|\d)'
          - name: 0.8 to 1.2 GB
            implementation: SizeSpecification
            negate: false
            required: true
            fields:
              min: 0.8
              max: 1.2
          - name: Single episode
            implementation: ReleaseTypeSpecification
            negate: false
            required: true
            fields:
              value: 1
      # Radarr: the same for movies (about 2 hours): 4-6 GB ranks lower, over 6 GB is rejected.
      - trash_id: lichnovsky-x265-large-movie
        trash_scores:
          default: 0
        name: x265 large (movie)
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: x265
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '[xh][ ._-]?265|\bHEVC(\b|\d)'
          - name: 4 to 6 GB
            implementation: SizeSpecification
            negate: false
            required: true
            fields:
              min: 4
              max: 6
      - trash_id: lichnovsky-x265-too-large-movie
        trash_scores:
          default: 0
        name: x265 too large (movie)
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: x265
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '[xh][ ._-]?265|\bHEVC(\b|\d)'
          - name: Over 6 GB
            implementation: SizeSpecification
            negate: false
            required: true
            fields:
              min: 6
              max: 1000
      - trash_id: lichnovsky-x265-too-large
        trash_scores:
          default: 0
        name: x265 too large
        includeCustomFormatWhenRenaming: false
        specifications:
          - name: x265
            implementation: ReleaseTitleSpecification
            negate: false
            required: true
            fields:
              value: '[xh][ ._-]?265|\bHEVC(\b|\d)'
          - name: Over 1.2 GB
            implementation: SizeSpecification
            negate: false
            required: true
            fields:
              min: 1.2
              max: 1000
          - name: Single episode
            implementation: ReleaseTypeSpecification
            negate: false
            required: true
            fields:
              value: 1

    sonarr:
      main:
        base_url: http://sonarr
        api_key: !env SONARR_API_KEY
        quality_definition:
          type: series
          # Minimum 2.5 MB per minute (about 110 MB for a 44 min episode), so small x265 encodes
          # pass. TRaSH: 15. Applies to every profile.
          qualities:
            - { quality: HDTV-1080p, min: 2.5, preferred: 995, max: 1000 }
            - { quality: WEBRip-1080p, min: 2.5, preferred: 995, max: 1000 }
            - { quality: WEBDL-1080p, min: 2.5, preferred: 995, max: 1000 }
        # Do not prefer REPACK/PROPER by itself: otherwise a v2 file blocks every better-scored v1
        # release. TRaSH's Repack/Proper format adds a few points instead.
        media_management:
          downloadPropersAndRepacks: doNotPrefer
        delete_unmanaged_quality_profiles:   # the built-in Any, SD, HD-720p, Ultra-HD, ...
          enabled: true
        include:
          - template: 72dae194fc92bf828f32cde7744e51a1   # TRaSH WEB-1080p (the default)
            source: TRASH
          - template: c4cadd6b35b95f62c3d47a408e53e2f7   # TRaSH WEB-2160p (Combined): 2160p, else 1080p
            source: TRASH
        # Same two names as in Radarr. 720p, remuxes etc. only by hand (Interactive Search).
        renameQualityProfiles:
          - from: WEB-1080p
            to: 1080p
          - from: WEB-2160p (Combined)
            to: 4K, else 1080p
        # 1080p (TRaSH name WEB-1080p): HDTV-1080p in the same group as WEB, because x265 encodes
        # without "WEB" in the name parse as HDTV. The score then decides.
        quality_profiles:
          - name: WEB-1080p
            upgrade:
              allowed: true
              until_quality: WEB 1080p
            qualities:
              - name: WEB 1080p
                qualities: [WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
        # HEVC scores for 1080p. x265 (HD): TRaSH -10000.
        custom_formats:
          - trash_ids:
              - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
            assign_scores_to:
              - name: WEB-1080p
                score: 2500
          - trash_ids:
              - lichnovsky-small-x265-groups
            assign_scores_to:
              - name: WEB-1080p
                score: 10000
          - trash_ids:
              - lichnovsky-small-x265-names
            assign_scores_to:
              - name: WEB-1080p
                score: -500
          - trash_ids:
              - lichnovsky-x265-no-group
            assign_scores_to:
              - name: WEB-1080p
                score: -600
          - trash_ids:
              - lichnovsky-x265-large
            assign_scores_to:
              - name: WEB-1080p
                score: -600
          - trash_ids:
              - lichnovsky-x265-too-large
            assign_scores_to:
              - name: WEB-1080p
                score: -3000
        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default
        root_folders:
          - /media/shows
        download_clients:
          data:
            - name: qBittorrent
              type: qbittorrent
              enable: true
              remove_completed_downloads: true
              remove_failed_downloads: true
              fields:
                host: qbittorrent
                port: 80
                username: admin
                password: !env QBITTORRENT_PASSWORD
                tv_category: tv
                # No post-import category: with one, Sonarr never removes a finished torrent, and a
                # replaced file keeps its space through the torrent's hardlink.
                tv_imported_category: ""

    radarr:
      main:
        base_url: http://radarr
        api_key: !env RADARR_API_KEY
        quality_definition:
          type: movie
          # Minimum 8 MB per minute (about 1 GB for 2 hours), so mid-size x265 encodes pass. TRaSH:
          # 12.5 (WEB), 33.8 (HDTV), 50.8 (Bluray). Applies to every profile.
          qualities:
            - { quality: HDTV-1080p, min: 8, preferred: 1999, max: 2000 }
            - { quality: WEBDL-1080p, min: 8, preferred: 1999, max: 2000 }
            - { quality: WEBRip-1080p, min: 8, preferred: 1999, max: 2000 }
            - { quality: Bluray-1080p, min: 8, preferred: 1999, max: 2000 }
        # Do not prefer REPACK/PROPER by itself: otherwise a v2 file blocks every better-scored v1
        # release. TRaSH's Repack/Proper format adds a few points instead.
        media_management:
          downloadPropersAndRepacks: doNotPrefer
        delete_unmanaged_quality_profiles:   # the built-in Any, SD, HD-720p, Ultra-HD, ...
          enabled: true
        include:
          - template: d1d67249d3890e49bc12e275d989a7e9   # TRaSH HD Bluray + WEB (the default)
            source: TRASH
          - template: 64fb5f9858489bdac2af690e27c8f42f   # TRaSH UHD Bluray + WEB, reshaped below
            source: TRASH
        # "1080p": TRaSH's movie profile without its automatic 720p fallback. "4K, else 1080p",
        # chosen per movie (Seerr: Advanced, or Radarr): grabs 2160p if it exists, otherwise 1080p,
        # and upgrades to 2160p later. The Pi can't transcode 4K, so it plays only on devices that
        # decode it themselves (TV apps; not most browsers). 720p, remuxes etc. only by hand.
        quality_profiles:
          # One 1080p group, so the score decides: otherwise any H.264 Blu-ray beats every x265 file.
          - name: HD Bluray + WEB
            upgrade:
              allowed: true
              until_quality: Any 1080p
            qualities:
              - name: Any 1080p
                qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
          - name: UHD Bluray + WEB
            upgrade:
              allowed: true
              until_quality: Bluray-2160p
            qualities:
              - name: Bluray-2160p
              - name: WEB 2160p
                qualities: [WEBDL-2160p, WEBRip-2160p]
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities: [WEBDL-1080p, WEBRip-1080p]
        renameQualityProfiles:
          - from: HD Bluray + WEB
            to: 1080p
          - from: UHD Bluray + WEB
            to: 4K, else 1080p
        # HEVC scores for 1080p (TRaSH name HD Bluray + WEB). x265 (HD): TRaSH -10000.
        custom_formats:
          - trash_ids:
              - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 2500
          - trash_ids:
              - lichnovsky-small-x265-groups
            assign_scores_to:
              - name: HD Bluray + WEB
                score: 10000
          - trash_ids:
              - lichnovsky-small-x265-names
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -500
          - trash_ids:
              - lichnovsky-x265-no-group
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -600
          - trash_ids:
              - lichnovsky-x265-large-movie
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -600
          - trash_ids:
              - lichnovsky-x265-too-large-movie
            assign_scores_to:
              - name: HD Bluray + WEB
                score: -3000
        media_naming:
          folder: jellyfin-tmdb
          movie:
            rename: true
            standard: jellyfin-tmdb
        root_folders:
          - /media/movies
        download_clients:
          data:
            - name: qBittorrent
              type: qbittorrent
              enable: true
              remove_completed_downloads: true
              remove_failed_downloads: true
              fields:
                host: qbittorrent
                port: 80
                username: admin
                password: !env QBITTORRENT_PASSWORD
                movie_category: movies
                movie_imported_category: ""   # see Sonarr

    # Indexers themselves are added by hand in Prowlarr's UI (docs/setup.md); Prowlarr then pushes
    # them to Sonarr and Radarr. Tag an indexer "flaresolverr" if it sits behind a Cloudflare check.
    prowlarr:
      main:
        base_url: http://prowlarr
        api_key: !env PROWLARR_API_KEY
        tags:
          - flaresolverr
        # Prowlarr pushes this to every indexer in Sonarr/Radarr: skip near-dead torrents, which
        # stall (behind CGNAT a lone seeder is often unreachable).
        sync_profiles:
          data:
            - name: Standard
              minimum_seeders: 5
        indexer_proxies:
          data:
            - name: FlareSolverr
              type: FlareSolverr
              fields:
                host: http://flaresolverr:8191/
                requestTimeout: 60
              tags:
                - flaresolverr
        applications:
          data:
            - name: Sonarr
              type: Sonarr
              sync_level: fullSync
              fields:
                prowlarrUrl: http://prowlarr
                baseUrl: http://sonarr
                apiKey: !env SONARR_API_KEY
            - name: Radarr
              type: Radarr
              sync_level: fullSync
              fields:
                prowlarrUrl: http://prowlarr
                baseUrl: http://radarr
                apiKey: !env RADARR_API_KEY
          sync_indexers: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: configarr-repos
  namespace: tv
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: configarr
  namespace: tv
spec:
  schedule: "17 * * * *"
  timeZone: Europe/Prague
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: configarr
              image: ghcr.io/raydak-labs/configarr:1.33.0
              env:
                - { name: TZ, value: "Europe/Prague" }
                - { name: HOME, value: /tmp }
                - { name: STOP_ON_ERROR, value: "true" }   # a failed run shows up as a failed Job
              envFrom:
                - secretRef:
                    name: media
              volumeMounts:
                - { name: config, mountPath: /app/config/config.yml, subPath: config.yml }
                - { name: repos, mountPath: /app/repos }   # TRaSH-Guides clone, updated each run
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: config
              configMap:
                name: configarr
            - name: repos
              persistentVolumeClaim:
                claimName: configarr-repos
            - name: tmp
              emptyDir: {}
