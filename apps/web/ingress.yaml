apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: web
spec:
  ingressClassName: traefik
  rules:
    - host: lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# www -> apex (301) in Traefik, so it works on the LAN too.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: web
spec:
  redirectRegex:
    regex: ^https?://www\.lichnovsky\.eu/(.*)
    replacement: https://lichnovsky.eu/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-www
  namespace: web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: web-www-to-apex@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
