# Nightly restic backups (k8up) of every PVC annotated k8up.io/backup: "true", sent to the
# rest-server on the backup disk (rest-server.yaml). A k8up Schedule only covers PVCs in its own
# namespace, so there is one per namespace, each with its own repository.
#
# What's included, the "most important things" (~ sizes are for a typical homelab):
#   security   Vaultwarden data + its nightly SQLite snapshots           (MBs)
#   documents  Papra database + documents                               (GBs)
#   photos     Immich database dumps only (albums, people, metadata)     (MBs-GBs)
#   monitoring Uptime Kuma                                              (MBs)
#   dns        AdGuard Home config                                      (KBs)
# Left out on purpose: the Immich PHOTO LIBRARY (too big for the SD card, so add it with the bigger
# disk), Prometheus/Loki data, the Immich ML model cache, Jellyfin config and media.
#
# Secret `k8up-repo` in each namespace holds RESTIC_PASSWORD plus the rest-server login
# REST_USER (= namespace) / REST_PASSWORD (scripts/secrets.sh generates all of them).
#
# The restic pods run as root (podSecurityContext below): the k8up image's default UID 65532 can't
# read files the apps create with mode 0600 (e.g. AdGuard's config), and would silently skip them.
# LOSE THE RESTIC PASSWORD = LOSE THE BACKUPS. Keep it in your password manager AND on paper.
#
# Times: Vaultwarden snapshot 02:30, Immich pg_dump 03:00, restic 03:30-04:10.
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nightly
  namespace: security
spec:
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: RESTIC_PASSWORD
    rest:
      url: http://rest-server.backups.svc.cluster.local:8000/security
      userSecretRef:
        name: k8up-repo
        key: REST_USER
      passwordSecretReg:     # sic: the field name in k8up's CRD really is "Reg"
        name: k8up-repo
        key: REST_PASSWORD
  backup:
    schedule: "30 3 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "30 5 * * 0"          # weekly: restic check verifies the repository's integrity
  prune:
    schedule: "30 6 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
