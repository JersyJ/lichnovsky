# Backup target: restic REST server writing to the backup disk mounted on rpi-01 at /srv/backup.
# Today that's the 128 GB SD card (a different device from the NVMe that holds the data).
# Later, mount a bigger disk at /srv/backup instead, or point the k8up Schedules at R2/S3;
# nothing else changes.
#
# Every namespace backs up into its own restic repository (/srv/backup/restic/<namespace>).
# Three layers of protection:
#  - restic encrypts each repository with the RESTIC_PASSWORD from that namespace's `k8up-repo`
#    Secret, so this server only ever stores ciphertext;
#  - --private-repos + htpasswd: the user `<namespace>` can only reach /<namespace>/ (so a
#    compromised app can't touch another app's backups);
#  - the NetworkPolicy below only admits the backed-up namespaces.
# The htpasswd file is the SealedSecret `rest-server-htpasswd` (`scripts/seal.sh backups` generates it).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-restic
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-backup
  local:
    path: /srv/backup/restic    # must exist and be owned by 1000:1000 (docs/guide.md, Phase 1)
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [rpi-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-restic
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-backup
  volumeName: backup-restic
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: backups
  labels:
    app: rest-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-server
          image: restic/rest-server:0.14.0
          command: ["rest-server"]
          args:
            - --path=/data
            - --listen=:8000
            - --htpasswd-file=/etc/rest-server/htpasswd
            - --private-repos
            - --prometheus
            - --prometheus-no-auth
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: htpasswd, mountPath: /etc/rest-server, readOnly: true }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backup-restic
        - name: htpasswd
          secret:
            secretName: rest-server-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server
  namespace: backups
  labels:
    app: rest-server
spec:
  selector:
    app: rest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Only restic pods from the backed-up namespaces (and Prometheus) may talk to the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rest-server
  namespace: backups
spec:
  podSelector:
    matchLabels:
      app: rest-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [security, documents, photos, monitoring, dns]
      ports:
        - port: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rest-server
  namespace: backups
spec:
  selector:
    matchLabels:
      app: rest-server
  endpoints:
    - port: http
      interval: 120s
