# AdGuard Home: the LAN's DNS server, plus split-horizon DNS for *.lichnovsky.eu.
# hostNetwork keeps the real client IPs, so per-device stats and rules work (a ServiceLB/NodePort
# would SNAT them). Pinned to rpi-01 because the router hands out that IP as the DNS server.
#
# First start: open http://192.168.50.244:3000 for the setup wizard.
#   - Admin web interface: all interfaces, port 3000 (80/443 belong to Traefik via ServiceLB)
#   - DNS server: all interfaces, port 53
# Then in Filters -> DNS rewrites, point the whole domain at the Pi (the website runs here too):
#   lichnovsky.eu -> 192.168.50.244   and   *.lichnovsky.eu -> 192.168.50.244
# LAN clients now hit Traefik directly (no Cloudflare hop, no 100 MB upload limit).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-conf
  annotations:
    k8up.io/backup: "true"
  namespace: dns
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work
  namespace: dns
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: dns
  labels:
    app: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate          # hostNetwork ports can't be shared during a rolling update
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: rpi-01
      priorityClassName: system-cluster-critical   # DNS for the whole house: evict it last
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.79
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: http, containerPort: 3000, protocol: TCP }
          volumeMounts:
            - { name: conf, mountPath: /opt/adguardhome/conf }
            - { name: work, mountPath: /opt/adguardhome/work }
          readinessProbe:
            tcpSocket:
              port: 53
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
      volumes:
        - name: conf
          persistentVolumeClaim:
            claimName: adguard-conf
        - name: work
          persistentVolumeClaim:
            claimName: adguard-work
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: dns
spec:
  selector:
    app: adguard
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# LAN/Tailscale only: no public hostname exists for this in Cloudflare.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard
  namespace: dns
spec:
  ingressClassName: traefik
  rules:
    - host: dns.lichnovsky.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-web
                port:
                  number: 80
