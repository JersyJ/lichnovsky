# Needs the kube-prometheus-stack CRDs, so it can't live in platform/cluster (synced earlier).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik   # only the metrics Service has a port named "metrics"
  endpoints:
    - port: metrics
      interval: 60s
---
# Pods directly: Argo CD (wave -10) syncs before the ServiceMonitor CRD exists.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: argocd
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-application-controller
          - argocd-repo-server
          - argocd-server
          - argocd-applicationset-controller
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
---
# cloudflared connector metrics (the Cloudflare Tunnel dashboard 24874 reads these).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared
  namespace: networking
spec:
  selector:
    matchLabels:
      app: cloudflared
  endpoints:
    - port: metrics
      interval: 60s
---
# Key alerts for a one-node homelab. The kube-prometheus-stack defaults already cover pods,
# nodes, disks and PVCs; these add Pi-specific failure modes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
  namespace: monitoring
spec:
  groups:
    - name: homelab.rules
      rules:
        - alert: PiHighTemperature
          # The Pi SoC sensor shows up as thermal_zone (type cpu-thermal) and/or hwmon (cpu_thermal).
          expr: max(max(node_thermal_zone_temp) or max(node_hwmon_temp_celsius)) > 75
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Pi SoC is {{ $value }}°C, so it will start throttling at 80-85°C. Check the fan."
        - alert: PiUnderVoltage
          # Firmware under-voltage flag (rpi_volt hwmon), 1 while the 5V input sags. Causes throttling
          # and storage corruption. Sampled every scrape, so dips shorter than 60s can slip through.
          expr: max(node_hwmon_in_lcrit_alarm_volts{chip=~".*raspberrypi_hwmon"}) > 0
          labels: { severity: critical }
          annotations:
            summary: "Pi is under-volted. Check the power supply and cable."
        - alert: PiFanStopped
          # The fan idles at 0 RPM below ~50°C, so only alarm when it should be spinning.
          expr: max(node_hwmon_fan_rpm{chip="platform_cooling_fan"}) == 0 and max(node_thermal_zone_temp{type="cpu-thermal"}) > 60
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Pi fan reads 0 RPM while the SoC is above 60°C. Check the fan cable or clean the fan."
        - alert: CloudflareTunnelDown
          expr: sum(cloudflared_tunnel_ha_connections) < 1 or absent(cloudflared_tunnel_ha_connections)
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "cloudflared has no connections to the Cloudflare edge, so public sites are down."
        - alert: NodeMemoryPressure
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Less than 10% RAM available on {{ $labels.instance }}. Expect OOM kills."
