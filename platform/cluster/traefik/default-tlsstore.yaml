# Traefik's default certificate for every HTTPS route: the wildcard *.lichnovsky.eu from cert-manager.
# That's why LAN and Tailscale clients get a valid cert at https://<app>.lichnovsky.eu.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-lichnovsky-eu-tls
