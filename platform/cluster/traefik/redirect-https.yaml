# Vaultwarden needs HTTPS on the LAN path. Only on the web entry point: cloudflared uses the tunnel
# entry point, so tunnel traffic isn't redirected (no loop).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
