# Vaultwarden needs HTTPS on the LAN path. cloudflared also uses port 80 but sends
# X-Forwarded-Proto: https, so tunnel traffic isn't redirected (no loop).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
