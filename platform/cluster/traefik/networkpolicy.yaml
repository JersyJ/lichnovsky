# Only cloudflared may use the tunnel entry point: it trusts X-Forwarded-* and CF-Connecting-IP, so
# any other pod could fake a client IP there. Also closes the API/ping port 8080 to pods.
# Traffic from the Pi itself always passes (k3s network policy rule): kubelet probes, and
# Tailscale requests (masqueraded to 10.42.0.1). LAN clients keep their own IP (Local policy), so
# web and websecure are open to all sources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes: ["Ingress"]
  ingress:
    # web, websecure: LAN clients, and pods that call apps by their public names.
    - ports:
        - port: 8000
        - port: 8443
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: networking }
          podSelector:
            matchLabels: { app: cloudflared }
      ports:
        - port: 8001
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - port: 9100
