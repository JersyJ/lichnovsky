# Vaultwarden and Gokapi take the client IP from CF-Connecting-IP. Only Cloudflare may set it, so
# the LAN/Tailscale entry points (web, websecure) remove it. The tunnel entry point keeps it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-client-ip
  namespace: kube-system
spec:
  headers:
    customRequestHeaders:
      CF-Connecting-IP: ""
