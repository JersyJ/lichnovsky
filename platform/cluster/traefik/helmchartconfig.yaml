apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # web/websecure: LAN and Tailscale (via the LoadBalancer). tunnel: only cloudflared, through the
    # ClusterIP Service traefik-tunnel. Every Ingress listens on all three (asDefault).
    # web/websecure trust no forwarded headers, so no LAN or Tailscale device can fake its client
    # IP. Traefik sets X-Forwarded-For and X-Real-Ip to the real sender itself.
    ports:
      web:
        asDefault: true
        # Redirect plain HTTP to HTTPS (see redirect-https.yaml).
        http:
          middlewares:
            - kube-system-strip-client-ip@kubernetescrd
            - kube-system-redirect-https@kubernetescrd
      websecure:
        asDefault: true
        http:
          middlewares: ["kube-system-strip-client-ip@kubernetescrd"]
      # Trusts X-Forwarded-* from cloudflared, so apps see the real client IP and https. Not on
      # the LoadBalancer, so LAN and Tailscale devices can't reach it.
      tunnel:
        asDefault: true
        port: 8001
        exposedPort: 80
        protocol: TCP
        expose:
          default: false
          tunnel: true
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
    service:
      # Local: kube-proxy doesn't masquerade LAN traffic, so Traefik sees the client IP instead of
      # 10.42.0.1. Only works on nodes that run Traefik: with a second node, make Traefik a
      # DaemonSet.
      spec:
        externalTrafficPolicy: Local
      additionalServices:
        tunnel:
          spec:
            type: ClusterIP
    # Metrics Service for the ServiceMonitor in platform/monitoring.
    metrics:
      prometheus:
        service:
          enabled: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    logs:
      access:
        enabled: true
