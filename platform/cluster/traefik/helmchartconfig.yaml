apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Trust X-Forwarded-* headers from pods (cloudflared). Apps then see the real
    # client IP and scheme (https) instead of the cloudflared pod's IP.
    ports:
      web:
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
        # Redirect plain HTTP to HTTPS (see redirect-https.yaml; tunnel traffic passes through).
        http:
          middlewares: ["kube-system-redirect-https@kubernetescrd"]
      websecure:
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
    # Metrics Service for the ServiceMonitor in platform/monitoring.
    metrics:
      prometheus:
        service:
          enabled: true
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
    logs:
      access:
        enabled: true
