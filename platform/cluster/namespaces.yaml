# warn: restricted flags regressions. enforce: baseline where k8up backs up (restic runs as root).
# --- platform -------------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: networking            # cloudflared
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring            # Prometheus, Grafana, Loki, Alloy, Uptime Kuma; node-exporter needs hostNetwork/hostPID/hostPath
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale             # proxy pods set sysctls in a privileged init container
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: backups               # restic rest-server
  labels:
    pod-security.kubernetes.io/enforce: restricted
# --- apps -----------------------------------------------------------------------------------------
---
apiVersion: v1
kind: Namespace
metadata:
  name: web                   # lichnovsky.eu website
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: dns                   # AdGuard Home: hostNetwork to see real client IPs on :53
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: papra
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: photos                # Immich + its Postgres + Valkey
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tv                    # Jellyfin (tv.lichnovsky.eu)
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
