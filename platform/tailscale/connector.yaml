# Remote devices reach Traefik and AdGuard at the Pi's LAN IP, exactly as at home.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: pi-lan
spec:
  hostname: lichnovsky-lan
  tags: ["tag:k8s"]
  subnetRouter:
    advertiseRoutes:
      - 192.168.50.244/32    # the Pi (use 192.168.50.0/24 to reach the whole LAN)
