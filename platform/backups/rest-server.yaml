# --private-repos + htpasswd: user <namespace> can only reach /<namespace>/, so a compromised app
# can't touch another app's backups.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-restic
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-backup
  local:
    path: /srv/backup/restic    # owned by 1000:1000 (host/02-setup-pi.sh)
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [rpi-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-restic
  namespace: backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-backup
  volumeName: backup-restic
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  namespace: backups
  labels:
    app: rest-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rest-server
  template:
    metadata:
      labels:
        app: rest-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rest-server
          image: restic/rest-server:0.14.0
          command: ["rest-server"]
          args:
            - --path=/data
            - --listen=:8000
            - --htpasswd-file=/etc/rest-server/htpasswd
            - --private-repos
            - --prometheus
            - --prometheus-no-auth
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: htpasswd, mountPath: /etc/rest-server, readOnly: true }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backup-restic
        - name: htpasswd
          secret:
            secretName: rest-server-htpasswd
---
apiVersion: v1
kind: Service
metadata:
  name: rest-server
  namespace: backups
  labels:
    app: rest-server
spec:
  selector:
    app: rest-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Only restic pods from the backed-up namespaces (and Prometheus) may talk to the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rest-server
  namespace: backups
spec:
  podSelector:
    matchLabels:
      app: rest-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [vaultwarden, papra, photos, monitoring, dns, tv]
      ports:
        - port: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rest-server
  namespace: backups
spec:
  selector:
    matchLabels:
      app: rest-server
  endpoints:
    - port: http
      interval: 120s
