# One Schedule per namespace: a k8up Schedule only covers PVCs in its own namespace.
# restic runs as root: the default UID 65532 silently skips 0600 files (e.g. AdGuard's config).
# Times: Vaultwarden snapshot 02:30, Immich pg_dump 03:00, restic 03:30-04:25.
# Opt-in (argocd/13-k8up.yaml): only PVCs annotated k8up.io/backup: "true". In tv that's the media
# stack's settings, not the library or Jellyfin's config. In share, Gokapi's settings and database,
# not the shared files (those are in R2).
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nightly
  namespace: vaultwarden
spec:
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: RESTIC_PASSWORD
    rest:
      url: http://rest-server.backups.svc.cluster.local:8000/vaultwarden
      userSecretRef:
        name: k8up-repo
        key: REST_USER
      passwordSecretReg:     # sic: the field name in k8up's CRD really is "Reg"
        name: k8up-repo
        key: REST_PASSWORD
  backup:
    schedule: "30 3 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "30 5 * * 0"   # weekly integrity check
  prune:
    schedule: "30 6 * * 0"
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
