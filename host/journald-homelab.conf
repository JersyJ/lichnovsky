# /etc/systemd/journald.conf.d/homelab.conf
# Keeps the host journal (systemd, SSH, kernel, the k3s service) on disk, capped. Raspberry Pi OS
# keeps it in RAM only (40-rpi-volatile-storage.conf), so a reboot would wipe the cause of a crash.
# This file sorts after that one, so it wins. Container logs are separate.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=1month
