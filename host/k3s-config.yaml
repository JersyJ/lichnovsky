# /etc/rancher/k3s/config.yaml, written BEFORE running the k3s installer.
write-kubeconfig-mode: "0600"

# etcd instead of SQLite: ~150 MB more RAM, but snapshots and more control-plane nodes later.
cluster-init: true
etcd-snapshot-schedule-cron: "0 */12 * * *"
etcd-snapshot-retention: 10
# On the backup disk, not the NVMe they protect.
etcd-snapshot-dir: /srv/backup/etcd

node-name: rpi-01
node-ip: 192.168.50.244         # reserved in the router (Wi-Fi, wlan0)
tls-san:
  - rpi-01
  - rpi-01.local
  - k8s.lichnovsky.eu           # kubeconfig server; resolves via AdGuard / Tailscale only

# Traefik and ServiceLB stay enabled: LAN/Tailscale clients reach Traefik on the node IP directly.

# The kubelet evicts pods before the kernel OOM killer steps in.
kubelet-arg:
  - "system-reserved=cpu=250m,memory=384Mi"
  - "kube-reserved=cpu=250m,memory=384Mi"
  - "eviction-hard=memory.available<256Mi,nodefs.available<10%"
  - "container-log-max-size=10Mi"
  - "container-log-max-files=3"

# Control-plane metrics stay off: many series for little value (kube-prometheus-stack skips them too).
