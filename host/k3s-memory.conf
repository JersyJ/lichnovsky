# /etc/systemd/system/k3s.service.d/memory.conf
# Go soft memory cap for the k3s server (API server + etcd + controllers in one process).
# Without it, Go lets the heap grow to ~2x the live data before collecting (measured: ~800 MiB
# live, ~1.7 GB RSS). The cap makes the GC work harder instead. It's soft: k3s can exceed it
# briefly under load, it won't be killed. Don't set it below the live heap (the GC would then
# run constantly and burn CPU).
[Service]
Environment=GOMEMLIMIT=1300MiB
