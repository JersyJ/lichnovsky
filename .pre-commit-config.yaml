# Git hooks, run by prek (https://github.com/j178/prek); it reads this standard pre-commit format.
#   prek install          # installs both hook types listed below
#   prek run --all-files  # run everything once, on demand
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint        # uses the repo's .yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks        # API tokens, webhook URLs, keys pasted anywhere by mistake

  - repo: local
    hooks:
      - id: no-plaintext-secrets
        name: no plaintext Kubernetes Secrets (seal them with scripts/seal.sh)
        language: pygrep
        entry: '^kind:\s*Secret\s*$'
        files: \.ya?ml$

      - id: tofu-fmt
        name: tofu fmt (cloudflare/)
        entry: tofu fmt -check -recursive cloudflare
        language: system
        files: ^cloudflare/.*\.(tf|tfvars|hcl)$
        pass_filenames: false

      # Slow (downloads charts and schemas), so it runs on push, not on every commit.
      # Needs helm and kubeconform on PATH.
      - id: validate-manifests
        name: helm render + kubeconform (scripts/validate.py)
        entry: uv run --script scripts/validate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
