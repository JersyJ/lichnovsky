# Run by prek: `prek install` once, `prek run --all-files` on demand.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks                # API tokens, webhook URLs, keys pasted anywhere by mistake
        args: [--config, .github/gitleaks.toml]

  - repo: local
    hooks:
      - id: no-plaintext-secrets
        name: no plaintext Kubernetes Secrets (seal them with scripts/seal.sh)
        language: pygrep
        entry: '^kind:\s*Secret\s*$'
        files: \.ya?ml$

      - id: tofu-fmt
        name: tofu fmt (cloudflare/)
        entry: tofu fmt -check -recursive cloudflare
        language: system
        files: ^cloudflare/.*\.(tf|tfvars|hcl)$
        pass_filenames: false

      # Pre-push only: downloads charts and schemas. Needs helm and kubeconform.
      - id: validate-manifests
        name: helm render + kubeconform
        entry: uv run --script scripts/validate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
